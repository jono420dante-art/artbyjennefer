# Netlify Configuration for Art by Jennefer
# This file contains build settings, redirects, and security headers for deployment

# Build settings
[build]
  # Directory to deploy (adjust based on your build output)
  publish = "dist"
  # Build command (adjust based on your build system)
  command = "npm run build"
  # Function directory for serverless functions (if needed)
  functions = "functions"

# Development settings
[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# SPA Routing - Redirect all requests to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = { "Language" = ["en"] }

# Specific redirect for portfolio/gallery paths (example - adjust as needed)
[[redirects]]
  from = "/gallery"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/portfolio"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

# HTTP to HTTPS redirect
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Security Headers
[[headers]]
  for = "/*"
  
  [headers.values]
    # Prevent clickjacking attacks
    X-Frame-Options = "SAMEORIGIN"
    
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Enable XSS protection in older browsers
    X-XSS-Protection = "1; mode=block"
    
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Permissions policy (Feature policy)
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    
    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none';"
    
    # Strict Transport Security (enables HTTPS for 1 year, including subdomains)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Security headers for images and media
[[headers]]
  for = "/images/*"
  
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Security headers for CSS and JavaScript
[[headers]]
  for = "/css/*"
  
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/js/*"
  
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Cache control for HTML files
[[headers]]
  for = "/*.html"
  
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Disable directory listing
[[headers]]
  for = "/"
  
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

# Context settings for preview and staging
[context.deploy-preview]
  command = "npm run build"
  
[context.branch-deploy]
  command = "npm run build"

# Production context
[context.production]
  command = "npm run build"
  
  [context.production.environment]
    NODE_VERSION = "18"
    NPM_VERSION = "9"

# Analytics and monitoring
[functions]
  node_bundler = "esbuild"
